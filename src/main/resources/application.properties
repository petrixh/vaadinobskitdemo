server.port=${PORT:8080}

logging.level.org.atmosphere = warn
# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false
# To improve the performance during development.
# For more information https://vaadin.com/docs/flow/spring/tutorial-spring-configuration.html#special-configuration-parameters
vaadin.allowed-packages = com.vaadin,org.vaadin,dev.hilla,com.example.application
spring.jpa.defer-datasource-initialization = true

vaadin.frontend.hotdeploy=false

# ---- Observability Kit 5 (Micrometer) ----
# Becomes the OpenTelemetry service.name; the Grafana dashboard filters on service_name="vaadin".
spring.application.name=vaadin

# Actuator: prometheus is the scrape alternative to OTLP push, vaadin is the kit's insights
# endpoint (GET /actuator/vaadin/observability lists failed and slow interactions).
management.endpoints.web.exposure.include=health,prometheus,vaadin

# Demo-friendly kit features that are off by default.
# vaadin.db.query spans + vaadin.db.fetch.rows per route
vaadin.observability.database=true
# attach the parameterised SQL as db.statement (demo only)
vaadin.observability.database-statement=true
# vaadin.ui.state.* gauges (relevant to the RAM leak demo)
vaadin.observability.ui-state=true
# exception messages/frames in the insights endpoint (demo only)
vaadin.observability.insights-details=true

# Custom instrumentation: @Observed needs the aspect enabled; sample every trace for the demo.
management.observations.annotations.enabled=true
management.tracing.sampling.probability=1.0

# No telemetry backend unless a profile says so (avoids connection-refused spam in a plain
# spring-boot:run). See application-grafana.properties / application-newrelic.properties.
management.otlp.metrics.export.enabled=false
management.tracing.export.enabled=false
