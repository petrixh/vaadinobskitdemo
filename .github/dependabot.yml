# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # The app-classpath OpenTelemetry versions are capped by whatever the
    # Observability Kit AGENT bundles (see the comment in pom.xml). Going above the
    # agent's versions makes Vaadin instrumentation fail SILENTLY - the build and the
    # standard OTel traces still work, only the Vaadin spans quietly disappear.
    # These caps match observability-kit 4.1.1 (otel 1.62.0 / javaagent 2.28.0).
    # When the agent version in observability-kit/_downloadAgent.sh changes, re-read
    # https://repo1.maven.org/maven2/com/vaadin/observability-kit/{VERSION}/observability-kit-{VERSION}.pom
    # and update these two bounds to match.
    ignore:
      - dependency-name: "io.opentelemetry:opentelemetry-api"
        versions: [">1.62.0"]
      - dependency-name: "io.opentelemetry.instrumentation:opentelemetry-instrumentation-annotations"
        versions: [">2.28.0"]
    groups:
      minor-and-patch-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      major-updates:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "docker"
    directory: "/playwright" # Location of docker-compose.yml
    schedule:
      interval: "weekly"

  # Without this the workflow's actions never get update PRs - that is how
  # actions/checkout stayed on v4 while the rest of the repo moved on.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"